<style id="gate-style">
  html,body{margin:0;height:100%;background:#07060f;color:#ecebff;font:14px/1.45 Inter,system-ui,sans-serif}
  .gate{min-height:100%;display:grid;place-items:center;padding:16px;box-sizing:border-box;
    background:radial-gradient(900px 400px at 80% -10%,rgba(155,107,255,.25),transparent 60%),radial-gradient(700px 400px at -10% 110%,rgba(94,242,255,.14),transparent 60%)}
  .card{width:100%;max-width:380px;background:#100e1f;border:1px solid #2a2550;border-radius:14px;padding:26px 24px}
  .logo{font-family:"Space Grotesk";font-weight:700;font-size:22px;letter-spacing:.02em;margin-bottom:4px}
  .logo b{background:linear-gradient(90deg,#5ef2ff,#9b6bff,#ff4fd8);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#a9a6cc;margin:0 0 16px}
  input{width:100%;box-sizing:border-box;background:#171431;border:1px solid #2a2550;border-radius:8px;padding:10px 12px;color:#ecebff;font:inherit}
  input:focus{outline:none;border-color:#9b6bff}
  button{margin-top:10px;width:100%;border:none;border-radius:8px;padding:10px;font:600 14px Inter;color:#fff;cursor:pointer;background:linear-gradient(90deg,#2a7f9a,#6b47d6)}
  .err{color:#ff4f6a;min-height:20px;margin-top:8px;font-size:13px}
</style>
</head>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = 'Unlocking…';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(SEALED.salt), iterations: SEALED.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(SEALED.iv) }, key, b64(SEALED.ct));
    const app = JSON.parse(new TextDecoder().decode(plain));
    const url = (code) => URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    window.__AURASET_WORKER_URL = url(app.worker);
    window.__AURASET_WORKLET_URL = url(app.worklet);
    document.getElementById('gate-style')?.remove(); // the gate's styles must not leak into the app
    const style = document.createElement('style'); style.textContent = app.css; document.head.appendChild(style);
    document.title = 'AuraSet V2';
    document.body.innerHTML = app.html;
    await import(url(app.main));
  } catch (x) { console.error(x); err.textContent = 'That passphrase did not unlock it.'; }
});
